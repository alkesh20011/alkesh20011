name: Render profile panels

on:
  schedule:
    - cron: "17 1 * * *"      # daily, ~06:47 IST
  workflow_dispatch: {}
  push:
    branches: [master, main]
    paths:
      - "scripts/**"
      - ".github/workflows/panels.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pyswisseph

      - name: Render GitHub stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/render_stats.py

      - name: Render sky over Jaipur
        run: python scripts/render_sky.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/sky.svg
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh profile panels"
            git push
          fi
